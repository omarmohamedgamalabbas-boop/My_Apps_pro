name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        elif [ -f "./myapps/gradlew" ]; then
          cd myapps && ./gradlew assembleDebug --stacktrace
        else
          echo "gradlew not found" && exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
